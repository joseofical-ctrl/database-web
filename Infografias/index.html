<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Técnico T-SQL - 30 Proyectos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col relative">

    <header class="bg-[#0f172a] text-white px-8 py-5 flex flex-col md:flex-row justify-between items-center border-b border-slate-800 shrink-0 shadow-lg relative overflow-hidden sticky top-0 z-50">
        <div class="absolute inset-0 bg-gradient-to-r from-blue-900/20 to-transparent z-0"></div>
        <div class="relative z-10">
            <h1 class="text-2xl font-bold tracking-tight flex items-center gap-3">
                <div class="bg-blue-600/20 p-2 rounded-lg"><i class="fa-solid fa-database text-blue-400"></i></div>
                Universidad Peruana Los Andes
            </h1>
            <p class="text-slate-400 text-sm mt-1 ml-12">Escuela Profesional de Ingeniería de Sistemas y Computación</p>
        </div>
        <div class="text-right mt-3 md:mt-0 relative z-10">
            <p class="font-semibold text-sm text-blue-400 uppercase tracking-widest">Portafolio Interactivo - Actividad 8</p>
            <p class="text-slate-300 text-sm mt-1">Jose Antonio Castro Mayta | VI Ciclo | Base de Datos II</p>
        </div>
    </header>

    <div class="bg-[#1e293b] border-b border-slate-700 shadow-md z-40 shrink-0 sticky top-[88px] md:top-[80px]">
        <div class="flex items-center max-w-7xl mx-auto">
            <button id="scroll-left" class="bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 px-5 py-3 h-full border-r border-slate-700 transition-colors flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <div id="project-nav" class="flex overflow-x-auto hide-scroll py-2.5 px-3 gap-2 flex-grow scroll-smooth">
                </div>
            
            <button id="scroll-right" class="bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 px-5 py-3 h-full border-l border-slate-700 transition-colors flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8 flex flex-col items-center z-10 relative">
        <div id="project-viewport" class="w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 flex flex-col transition-all duration-300 mb-8">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
