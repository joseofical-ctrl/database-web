            projects.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.className = `shrink-0 px-4 py-2 rounded-lg flex items-center gap-2 transition-all font-medium text-sm border whitespace-nowrap ${idx === 0 ? 'bg-blue-600 text-white border-blue-500 shadow-sm' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`;
                btn.id = `nav-btn-${p.id}`;
                btn.onclick = () => selectProject(p.id);
                btn.innerHTML = `
                    <span class="w-6 h-6 flex items-center justify-center rounded text-xs font-bold shrink-0 ${idx === 0 ? 'bg-blue-700 text-white' : 'bg-slate-900 text-slate-400'}">${p.id}</span>
                    <span class="">Proyecto ${p.id}</span>
                `;
                nav.appendChild(btn);
            });

            // Lógica de los botones de scroll
            const scrollContainer = document.getElementById('project-nav');
            document.getElementById('scroll-left').onclick = () => {
                scrollContainer.scrollBy({ left: -200, behavior: 'smooth' });
            };
            document.getElementById('scroll-right').onclick = () => {
                scrollContainer.scrollBy({ left: 200, behavior: 'smooth' });
            };
        }

                                    <div class="w-3 h-3 rounded-full bg-yellow-500 border border-yellow-600"></div>
                                    <div class="w-3 h-3 rounded-full bg-green-500 border border-green-600"></div>
                                    <span class="ml-3 text-slate-400 text-xs font-medium code-font">script_${id}.sql</span>
                                </div>
                                <div class="bg-slate-900 p-5 code-font text-[15px] leading-relaxed text-slate-300 whitespace-pre overflow-x-auto custom-scrollbar">${p.script}</div>
                            </div>
                        </div>

                        <!-- Tabla de Resultados -->
                        <div class="flex-grow flex flex-col min-h-[250px]">
                            <div class="flex items-end justify-between mb-2">
                                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Output (Recordset)</h3>
                                <span class="text-xs font-medium bg-green-50 text-green-700 px-2.5 py-1 rounded-md border border-green-200 shadow-sm"><i class="fa-solid fa-circle-check text-green-500 mr-1.5"></i>Query ejecutada con éxito</span>
                            </div>
                            
                            <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm flex-1 bg-white flex flex-col">
                                <div class="overflow-x-auto overflow-y-auto custom-scrollbar flex-1">
                                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap min-w-full">
                                        <thead class="bg-slate-50 text-slate-600 sticky top-0 shadow-sm z-10">
                                            <tr>${tableHeaders}</tr>
                                        </thead>
                                        <tbody class="text-slate-700">${tableRows}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        // Carga inicial
        window.onload = () => {
            renderNavbar();
            if(projects.length > 0) {
                selectProject(projects[0].id);
            }
        };
    </script>
</body>
